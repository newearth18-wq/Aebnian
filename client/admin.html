<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ครูจัดการข้อสอบ · แอบเนียน</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <div><span class="eyebrow">AEB NIAN · TEACHER STUDIO</span><h1>จัดการข้อสอบ</h1><p>สร้างและเผยแพร่ชุดคำถามให้นักเรียนตอบระหว่างเล่นเกม</p></div>
      <a href="/">← กลับไปเกม</a>
    </header>
    <div id="message" role="status" aria-live="polite"></div>
    <section id="authPanel" class="card auth">
      <h2>เข้าสู่ระบบครู</h2>
      <p>ข้อสอบจะเก็บในฐานข้อมูลถาวร และครูแก้ไขได้เฉพาะชุดของบัญชีตนเอง</p>
      <form id="loginForm">
        <label>อีเมล<input id="email" type="email" autocomplete="email" required></label>
        <label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <div class="buttons"><button class="primary" type="submit">เข้าสู่ระบบ</button><button id="signup" type="button">สมัครบัญชีครู</button></div>
      </form>
    </section>
    <section id="editorPanel" class="hidden">
      <div class="toolbar"><span id="identity"></span><button id="newPack" type="button">+ ชุดข้อสอบใหม่</button><button id="logout" type="button">ออกจากระบบ</button></div>
      <div class="layout">
        <aside class="card"><h2>ชุดข้อสอบของฉัน</h2><div id="packList"></div></aside>
        <form id="packForm" class="card">
          <h2>รายละเอียดชุดข้อสอบ</h2>
          <label>ชื่อชุดข้อสอบ<input id="packTitle" maxlength="120" required placeholder="เช่น วิทยาศาสตร์ ม.1"></label>
          <label>คำอธิบาย<textarea id="packDescription" rows="2" placeholder="หัวข้อหรือคำแนะนำ"></textarea></label>
          <label class="check"><input id="packPublished" type="checkbox"> เผยแพร่ให้นักเรียนเลือกเล่น</label>
          <div class="sectionHead"><h2>คำถาม</h2><button id="addQuestion" type="button">+ เพิ่มข้อ</button></div>
          <div id="questionEditor"></div>
          <button class="primary" type="submit">บันทึกชุดข้อสอบ</button>
        </form>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
